[project]
name = "resume-flow-api"
version = "0.1.0"
description = "SAFEER / Resume Flow API"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.138.2",
    "google-genai>=2.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "texsoup>=0.3.1",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.0",
    "slowapi>=0.1.9",
    "livekit>=1.1.12",
    "livekit-agents[google,turn-detector]>=1.6.4",
    "livekit-api>=1.1.1",
    "livekit-plugins-noise-cancellation>=0.2.6",
    "cryptography>=49.0.0",
    "aiohttp>=3.8.0",
    "async-lru>=2.0.0",
    "PyJWT>=2.8.0",
    "uuid-utils>=0.14.0",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
